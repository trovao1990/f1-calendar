<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      id="meta-description"
      name="description"
      content="Consulte o calendário da Fórmula 1 por ano e baixe eventos para o calendário do seu celular."
    />
    <title id="page-title">F1 Calendário — Horários por ano</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="header__brand">
          <span class="header__logo" aria-hidden="true">F1</span>
          <div>
            <h1 id="header-title" class="header__title">Calendário F1</h1>
            <p id="header-subtitle" class="header__subtitle">
              Datas, horários e download para o seu calendário
            </p>
          </div>
        </div>
      </header>

      <section id="controls" class="controls" aria-label="Filtros">
        <div class="control">
          <label id="label-year" for="year-select">Temporada</label>
          <select id="year-select" aria-label="Selecionar ano"></select>
        </div>
        <div class="control control--wide">
          <label id="label-timezone" for="timezone-select">Fuso horário</label>
          <select id="timezone-select" aria-label="Selecionar fuso horário"></select>
        </div>
        <div class="control">
          <label id="label-language" for="language-select">Idioma</label>
          <select id="language-select" aria-label="Selecionar idioma"></select>
        </div>
        <button type="button" id="download-season-btn" class="btn btn--primary">
          Baixar temporada (.ics)
        </button>
      </section>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <main id="events-container" class="events"></main>

      <footer class="footer">
        <p id="footer-text">
          <span id="footer-data">Dados via</span>
          <a href="https://github.com/jolpica/jolpica-f1" target="_blank" rel="noopener noreferrer"
            >Jolpica F1 API</a
          >. <span id="footer-note">Horários convertidos para o fuso selecionado.</span>
        </p>
      </footer>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
